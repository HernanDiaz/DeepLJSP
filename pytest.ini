; `pytest` a secas recogia todo el arbol: los scripts de scripts/ que
; empiezan por test_ y son lanzadores, no pruebas, y la copia del
; codigo que va al deposito de Zenodo, con lo que la suite salia con
; cientos de errores de recoleccion en vez de correr. Las pruebas
; viven en tests/ y solo ahi.
[pytest]
testpaths = tests
norecursedirs = zenodo_drl zenodo_deposit review_ws outputs benchmarks
    models instances rules tuning venv .git paper_gp drl-eaai
